<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="calculator-shell">
      <section class="calculator" aria-label="Calculator">
        <div class="display-panel">
          <div id="expression" class="expression">0</div>
          <div id="result" class="result">0</div>
        </div>

        <div class="keypad">
          <button class="action" data-action="clear">C</button>
          <button class="action" data-action="delete">⌫</button>
          <button class="operator" data-value="/">÷</button>
          <button class="operator" data-value="*">×</button>

          <button data-value="7">7</button>
          <button data-value="8">8</button>
          <button data-value="9">9</button>
          <button class="operator" data-value="-">−</button>

          <button data-value="4">4</button>
          <button data-value="5">5</button>
          <button data-value="6">6</button>
          <button class="operator" data-value="+">+</button>

          <button data-value="1">1</button>
          <button data-value="2">2</button>
          <button data-value="3">3</button>
          <button class="equals" data-action="equals">=</button>

          <button class="wide" data-value="0">0</button>
          <button data-value=".">.</button>
          <button class="operator" data-value="%">%</button>
          <button class="operator power" data-value="^" aria-label="Power">xʸ</button>
          <button class="operator root" data-action="sqrt" aria-label="Square root">√</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
